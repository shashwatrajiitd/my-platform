version: '3.8'

services:
  # Frontend (Next.js)
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next

  # Backend (FastAPI)
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      # pydantic-settings expects JSON for List[str] env vars
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
      # Store Chroma (SQLite) in a Docker-managed volume to avoid macOS bind-mount
      # SQLite "disk I/O error" issues.
      - CHROMA_PERSIST_DIR=/app/chroma
    volumes:
      - ../apps/api:/app
      - chroma_data:/app/chroma
    # TODO: Add when RAG is implemented
    # - ./data/vectorstore:/app/data/vectorstore

  # TODO: Add vector database when RAG is implemented
  # chromadb:
  #   image: chromadb/chroma:latest
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - ./data/chromadb:/chroma/chroma

volumes:
  chroma_data:
